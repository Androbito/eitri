# Checks on every pull request and every push to main, on all three systems Servante ships on.
#
# Everything a contributor can run locally runs here with the same command: ./gradlew checkAll.
# The Windows job is not a formality: the Windows Credential Manager implementation in storage is
# native code that no other runner can exercise. See docs/adr/0007.
name: Pull request

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compose Desktop renders through Skia, which needs a display. The Linux runner has none, so the
      # UI tests and the reference screenshots run under Xvfb here and nowhere else: see docs/adr/0008.
      - name: Install Xvfb and libsecret
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libsecret-tools

      - name: Check
        if: runner.os != 'Linux'
        run: ./gradlew checkAll --no-daemon --stacktrace

      - name: Check under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./gradlew checkAll --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 7
