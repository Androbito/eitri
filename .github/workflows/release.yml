# Installers, built on a tag and attached to the GitHub release.
#
# Servante ships desktop installers through GitHub Releases and nothing else: no store upload, no
# Fastlane, no signing identity in a secret. jpackage, which Compose Desktop drives, can only build an
# installer for the system it runs on, so there is one job per target.
name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build installers for
        required: true

permissions:
  contents: write

jobs:
  installers:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: DMG (Apple silicon)
            task: packageDmg
            artifacts: app/build/compose/binaries/main/dmg/*.dmg
          - os: macos-13
            label: DMG (Intel)
            task: packageDmg
            artifacts: app/build/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            label: MSI
            task: packageMsi
            artifacts: app/build/compose/binaries/main/msi/*.msi
          - os: ubuntu-latest
            label: DEB and AppImage
            task: packageDeb
            artifacts: |
              app/build/compose/binaries/main/deb/*.deb
              app/build/appimage/*.AppImage
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the installer
        run: ./gradlew :app:${{ matrix.task }} --no-daemon --stacktrace

      # jpackage has no AppImage target, so the AppImage is assembled from the app-image jpackage
      # produces. appimagetool is pinned by release rather than tracking latest, so a release built
      # today and one built next year are built the same way.
      - name: Build the AppImage
        if: runner.os == 'Linux'
        run: |
          ./gradlew :app:createDistributable --no-daemon
          mkdir -p build/appimage-tool
          curl -fsSL -o build/appimage-tool/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x build/appimage-tool/appimagetool
          ./scripts/packaging/build-appimage.sh

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    name: Attach installers to the release
    needs: installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: installers/**/*
          fail_on_unmatched_files: true
          draft: true
          body: |
            Installers for macOS, Windows and Linux. No account, no telemetry.

            Verify a download against the checksums in this release before installing it.
